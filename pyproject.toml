[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphite-ir"
version = "0.1.0"
description = "Heterograph schemas, matching, rewriting, and contracts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "heterograph",
    "pydantic>=2",
]

[tool.setuptools.packages.find]
include = ["graphite*"]
