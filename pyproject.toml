[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphite-ir"
version = "0.2.0"
description = "IR schemas, matching, and rewriting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "heterograph",
    "pydantic>=2",
]

[tool.setuptools.packages.find]
include = ["graphite*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
